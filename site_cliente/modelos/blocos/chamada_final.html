<section class="final" id="{{ bloco.id or 'contato' }}">
  {% if bloco.imagem_fundo %}<div class="fundo-img" style="background-image:url('{{ raiz }}assets/{{ bloco.imagem_fundo }}')"></div>{% endif %}
  <div class="cx">
    <div class="faixa-txt">
      <img class="selo" src="{{ raiz }}assets/{{ s.marca.icone }}" alt="" width="56" height="52">
      {% if bloco.olho %}<p class="olho">{{ bloco.olho }}</p>{% endif %}
      <h2>{{ bloco.titulo }}</h2>
      {% if bloco.texto %}<p>{{ bloco.texto }}</p>{% endif %}
      <div class="acoes">
        <a class="btn btn-amarelo" href="{{ link_whatsapp }}">Falar no WhatsApp</a>
        {% if s.empresa.formulario %}<a class="btn btn-linha" href="{{ s.empresa.formulario }}">Preencher o formulário</a>{% endif %}
      </div>
    </div>
  </div>
</section>
